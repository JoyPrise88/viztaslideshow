<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Vizta Race Display (Anti-Sleep)</title>
    <meta http-equiv="ScreenOrientation" content="autoRotate:disabled">
    <style>
      html, body {
        margin: 0; padding: 0; height: 100%;
        background-color: #000; overflow: hidden;
        font-family: "Poppins", system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
        cursor: none; /* layar TV jadi bersih */
      }
      iframe, video, img {
        position: absolute; inset: 0;
        width: 100%; height: 100%;
        border: none; object-fit: cover;
        transition: opacity 1s ease;
      }
      .hidden { opacity: 0; pointer-events: none; }
      .visible { opacity: 1; }

      .text-overlay {
        position: absolute; bottom: 60px; left: 50%;
        transform: translateX(-50%);
        text-align: center; color: white; z-index: 98;
        text-shadow: 0 0 10px rgba(0,0,0,0.8);
        transition: opacity 1s ease;
      }
      .text-overlay h2 { font-size: 2rem; font-weight: 700; margin: 0; color: #ffd700; }
      .text-overlay p { font-size: 1.2rem; margin-top: 8px; }

      /* Elemen penggerak halus (keep rendering frames) */
      #ticker {
        position: absolute; top: -1000px; left: -1000px; /* offscreen */
        width: 1px; height: 1px; color: transparent; user-select: none;
      }
    </style>
  </head>
  <body>
    <iframe id="leaderboardFrame" class="hidden" allowfullscreen></iframe>
    <div id="mediaContainer" class="hidden"></div>
    <div id="textOverlay" class="text-overlay hidden">
      <h2 id="titleText"></h2>
      <p id="captionText"></p>
    </div>

    <!-- Video anti-sleep (fallback kalau Wake Lock nggak ada/ditolak).
         Pakai file mini dari CDN NoSleep. Jika butuh offline, taruh file mp4 lokal dan ganti src. -->
    <video id="antiSleepVideo" playsinline muted loop preload="auto" class="hidden"
           src="https://cdn.jsdelivr.net/gh/richtr/NoSleep.js@0.12.0/src/media/no-sleep.mp4"></video>

    <!-- Elemen pemicu render -->
    <div id="ticker" aria-hidden="true"></div>

    <script>
      /*** ====== ELEMEN UTAMA ====== ***/
      const leaderboard = document.getElementById("leaderboardFrame");
      const mediaContainer = document.getElementById("mediaContainer");
      const textOverlay = document.getElementById("textOverlay");
      const titleText = document.getElementById("titleText");
      const captionText = document.getElementById("captionText");
      const antiSleepVideo = document.getElementById("antiSleepVideo");
      const ticker = document.getElementById("ticker");

      let slides = [];
      let currentIndex = 0;
      let slideTimer = null;

      /*** ====== ANTI-SCREENSAVER LAYER ====== ***/
      let wakeLock = null;
      let wakeLockSupported = 'wakeLock' in navigator;
      let lastKeepAlive = 0;

      async function requestWakeLock() {
        if (!wakeLockSupported) return false;
        try {
          wakeLock = await navigator.wakeLock.request('screen');
          console.log("✅ Screen Wake Lock aktif");
          wakeLock.addEventListener('release', () => {
            console.warn('⚠️ Wake Lock dilepas oleh sistem, coba ambil ulang…');
          });
          return true;
        } catch (err) {
          console.warn("❌ Gagal minta Wake Lock:", err?.name || err, err?.message || '');
          return false;
        }
      }

      async function ensureAwake() {
        // 1) Coba Screen Wake Lock
        let ok = false;
        if (wakeLockSupported) {
          if (!wakeLock) ok = await requestWakeLock(); else ok = true;
        }

        // 2) Fallback: putar video mini muted loop (mirip NoSleep)
        if (!ok) {
          try {
            await antiSleepVideo.play();
            console.log('✅ Anti-sleep video berjalan');
          } catch (e) {
            console.warn('⚠️ Autoplay video anti-sleep gagal; menunggu gesture pengguna/remote TV', e);
          }
        }
      }

      // Re-acquire jika tab berubah (beberapa TV melepas wakelock saat visibility change)
      document.addEventListener('visibilitychange', async () => {
        if (document.visibilityState === 'visible') {
          wakeLock = null;
          await ensureAwake();
        }
      });

      // Coba lagi berkala (jaga-jaga)
      setInterval(() => ensureAwake(), 60 * 1000);

      // Upaya lain: update “ticker” tiap ~10 detik agar engine render tetap aktif
      function startTicker() {
        function tick(t) {
          if (t - lastKeepAlive > 10000) {
            ticker.textContent = String(Date.now());
            lastKeepAlive = t;
          }
          requestAnimationFrame(tick);
        }
        requestAnimationFrame(tick);
      }

      // Gesture dari remote/klik bantu mengaktifkan autoplay policy di sebagian device
      ['click','keydown','touchstart','pointerdown'].forEach(ev=>{
        window.addEventListener(ev, async () => {
          if (antiSleepVideo.paused) {
            try { await antiSleepVideo.play(); } catch {}
          }
          if (!wakeLock && wakeLockSupported) {
            try { await requestWakeLock(); } catch {}
          }
        }, { once: false, passive: true });
      });

      /*** ====== SLIDES ENGINE (punyamu) ====== ***/
      function convertDriveLink(url) {
        const match = url?.match(/\/d\/(.*?)\//);
        return match && match[1]
          ? `https://drive.google.com/uc?export=download&id=${match[1]}`
          : url;
      }

      async function loadSlides() {
        try {
          const res = await fetch("./slides.json", { cache: "no-store" });
          slides = await res.json();
          currentIndex = 0;
          showSlide();
          // Auto reload JSON tiap 10 menit
          scheduleSlidesReload();
        } catch (err) {
          console.error("❌ Gagal load slides.json:", err);
          activateFallback();
        }
      }

      let reloadTimer;
      function scheduleSlidesReload() {
        clearTimeout(reloadTimer);
        reloadTimer = setTimeout(loadSlides, 10 * 60 * 1000);
      }

      function activateFallback() {
        clearTimeout(slideTimer);
        leaderboard.src = "https://viztarace.vgoneofficial.com/public/leaderboardtv";
        leaderboard.classList.add("visible");
        mediaContainer.classList.add("hidden");
        textOverlay.classList.add("hidden");
      }

      function showSlide() {
        if (!slides?.length) return activateFallback();

        clearTimeout(slideTimer);
        const current = slides[currentIndex];
        if (!current || !current.type) return nextSlide();

        // Reset overlay
        mediaContainer.innerHTML = "";
        titleText.textContent = current.title || "";
        captionText.textContent = current.caption || "";
        textOverlay.classList.toggle("hidden", !(current.title || current.caption));

        if (current.type === "leaderboard") {
          const url = current.url || "https://viztarace.vgoneofficial.com/public/leaderboardtv";
          leaderboard.src = url;
          fadeSwitch(leaderboard, mediaContainer);
          slideTimer = setTimeout(nextSlide, current.duration || 15000);
        } else {
          fadeSwitch(mediaContainer, leaderboard);
          const src = convertDriveLink(current.src);
          if (!src) return nextSlide();

          if (current.type === "video") {
            if (!src.endsWith(".mp4") && !src.includes("drive.google.com"))
              return nextSlide();

            const video = document.createElement("video");
            video.src = src;
            video.autoplay = true;
            video.muted = true;
            video.playsInline = true;
            video.preload = "auto";
            video.style.width = "100%";
            video.style.height = "100%";
            video.style.objectFit = "cover";

            video.onerror = () => {
              console.warn("⚠️ Video gagal dimuat:", src);
              nextSlide();
            };

            // autoplay fix
            video.addEventListener("loadeddata", () => {
              video.play().catch(() => {
                console.warn("⚠️ Autoplay gagal, retry…");
                setTimeout(() => video.play().catch(() => nextSlide()), 800);
              });
            });

            video.addEventListener("ended", nextSlide);

            mediaContainer.innerHTML = "";
            mediaContainer.appendChild(video);
            video.load();
          } else if (current.type === "photo") {
            // long image dwell; .png prefer, tapi izinkan .jpg/.jpeg juga
            if (!(src.endsWith(".png") || src.endsWith(".jpg") || src.endsWith(".jpeg")))
              return nextSlide();

            const img = document.createElement("img");
            img.src = src;
            img.alt = "Slide Image";
            img.onerror = () => {
              console.warn("⚠️ Gambar gagal dimuat:", src);
              nextSlide();
            };
            mediaContainer.innerHTML = "";
            mediaContainer.appendChild(img);
            slideTimer = setTimeout(nextSlide, current.duration || 15000);
          } else {
            nextSlide();
          }
        }
      }

      function fadeSwitch(showEl, hideEl) {
        showEl.classList.add("visible");
        showEl.classList.remove("hidden");
        hideEl.classList.add("hidden");
        hideEl.classList.remove("visible");
      }

      function nextSlide() {
        currentIndex = (currentIndex + 1) % slides.length;
        showSlide();
      }

      /*** ====== BOOTSTRAP ====== ***/
      (async function boot() {
        startTicker();
        await ensureAwake();
        await loadSlides();
      })();

      /*** ====== SAFETY NET: RELOAD HARIAN & NETWORK DROP HANDLING ====== ***/
      // Reload halaman 1x sehari (jam 03:00) untuk “bersih-bersih” memori browser TV
      function scheduleDailyReload() {
        const now = new Date();
        const next = new Date(now);
        next.setHours(3, 0, 0, 0);
        if (next <= now) next.setDate(next.getDate() + 1);
        setTimeout(() => location.reload(), next - now);
      }
      scheduleDailyReload();

      // Jika offline lama, coba auto-reload ketika online lagi
      window.addEventListener('online', () => location.reload());
    </script>
  </body>
</html>
