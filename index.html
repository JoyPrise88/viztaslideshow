<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Vizta Race Display (Full Anti-Sleep Mode)</title>
  <meta http-equiv="ScreenOrientation" content="autoRotate:disabled">
  <style>
    html, body {
      margin: 0; padding: 0; height: 100%;
      background-color: #000;
      overflow: hidden;
      font-family: "Poppins", system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      cursor: none;
    }
    iframe, video, img {
      position: absolute; inset: 0;
      width: 100%; height: 100%;
      border: none; object-fit: cover;
      transition: opacity 1s ease;
    }
    .hidden { opacity: 0; pointer-events: none; }
    .visible { opacity: 1; }
    .text-overlay {
      position: absolute; bottom: 60px; left: 50%;
      transform: translateX(-50%);
      text-align: center; color: white; z-index: 98;
      text-shadow: 0 0 10px rgba(0,0,0,0.8);
      transition: opacity 1s ease;
    }
    .text-overlay h2 { font-size: 2rem; font-weight: 700; margin: 0; color: #ffd700; }
    .text-overlay p { font-size: 1.2rem; margin-top: 8px; }
    #ticker {
      position:absolute; top:-9999px; left:-9999px;
      width:1px; height:1px; color:transparent;
    }
  </style>
</head>
<body>
  <iframe id="leaderboardFrame" class="hidden" allowfullscreen></iframe>
  <div id="mediaContainer" class="hidden"></div>
  <div id="textOverlay" class="text-overlay hidden">
    <h2 id="titleText"></h2>
    <p id="captionText"></p>
  </div>

  <!-- Fallback anti-sleep video -->
  <video id="antiSleepVideo" playsinline muted loop preload="auto"
         src="https://cdn.jsdelivr.net/gh/richtr/NoSleep.js@0.12.0/src/media/no-sleep.mp4"
         class="hidden"></video>

  <div id="ticker"></div>

  <script>
    /******** CONFIG ********/
    const HARD_REFRESH_EVERY_MS = 4 * 60 * 60 * 1000; // 4 jam
    const DAILY_RELOAD_HOUR = 3;

    const leaderboard = document.getElementById("leaderboardFrame");
    const mediaContainer = document.getElementById("mediaContainer");
    const textOverlay = document.getElementById("textOverlay");
    const titleText = document.getElementById("titleText");
    const captionText = document.getElementById("captionText");
    const antiSleepVideo = document.getElementById("antiSleepVideo");
    const ticker = document.getElementById("ticker");

    let slides = [];
    let currentIndex = 0;
    let slideTimer = null;
    let wakeLock = null;
    let lastKeepAlive = 0;

    /******** WAKE LOCK + ANTI SLEEP ********/
    async function requestWakeLock() {
      if ('wakeLock' in navigator) {
        try {
          wakeLock = await navigator.wakeLock.request('screen');
          console.log("✅ WakeLock aktif");
          wakeLock.addEventListener('release', () => {
            console.warn('⚠️ WakeLock dilepas');
          });
        } catch (e) {
          console.warn("⚠️ Gagal ambil WakeLock:", e);
        }
      }
    }

    async function ensureAwake() {
      // 1️⃣ Coba aktifkan WakeLock
      if ('wakeLock' in navigator && !wakeLock) {
        await requestWakeLock();
      }

      // 2️⃣ Mainkan video kecil tersembunyi agar render tetap hidup
      try {
        await antiSleepVideo.play();
        console.log("🎬 Anti-sleep video aktif");
      } catch (e) {
        console.warn("⚠️ Autoplay video ditolak:", e);
      }
    }

    // Keep refreshing wake setiap 30 dtk
    setInterval(() => ensureAwake(), 30000);

    // Ticker: fake render biar dianggap aktif
    function startTicker() {
      function tick(t) {
        if (t - lastKeepAlive > 5000) {
          ticker.textContent = Date.now();
          lastKeepAlive = t;
        }
        requestAnimationFrame(tick);
      }
      requestAnimationFrame(tick);
    }

    // Listener agar kalau fokus balik, wake lock diambil lagi
    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'visible') requestWakeLock();
    });

    /******** SLIDE ENGINE ********/
    function convertDriveLink(url) {
      const match = url?.match(/\/d\/(.*?)\//);
      return match ? `https://drive.google.com/uc?export=download&id=${match[1]}` : url;
    }

    async function loadSlides() {
      try {
        const res = await fetch("./slides.json", { cache: "no-store" });
        slides = await res.json();
        currentIndex = 0;
        showSlide();
        setTimeout(loadSlides, 10 * 60 * 1000);
      } catch (e) {
        console.error("❌ Gagal load slides.json:", e);
        activateFallback();
      }
    }

    function activateFallback() {
      leaderboard.src = "https://viztarace.vgoneofficial.com/public/leaderboardtv";
      leaderboard.classList.add("visible");
      mediaContainer.classList.add("hidden");
      textOverlay.classList.add("hidden");
    }

    function showSlide() {
      if (!slides?.length) return activateFallback();

      clearTimeout(slideTimer);
      const s = slides[currentIndex];
      if (!s || !s.type) return nextSlide();

      titleText.textContent = s.title || "";
      captionText.textContent = s.caption || "";
      textOverlay.classList.toggle("hidden", !(s.title || s.caption));

      if (s.type === "leaderboard") {
        leaderboard.src = s.url || "https://viztarace.vgoneofficial.com/public/leaderboardtv";
        fadeSwitch(leaderboard, mediaContainer);
        slideTimer = setTimeout(nextSlide, s.duration || 15000);
      } else {
        fadeSwitch(mediaContainer, leaderboard);
        const src = convertDriveLink(s.src);
        if (!src) return nextSlide();

        if (s.type === "video") {
          const vid = document.createElement("video");
          vid.src = src; vid.autoplay = true; vid.muted = true; vid.loop = false; vid.playsInline = true;
          vid.style.width = "100%"; vid.style.height = "100%"; vid.style.objectFit = "cover";
          vid.onerror = nextSlide;
          vid.onended = nextSlide;
          mediaContainer.innerHTML = "";
          mediaContainer.appendChild(vid);
        } else if (s.type === "photo") {
          const img = document.createElement("img");
          img.src = src; img.onerror = nextSlide;
          mediaContainer.innerHTML = "";
          mediaContainer.appendChild(img);
          slideTimer = setTimeout(nextSlide, s.duration || 15000);
        } else {
          nextSlide();
        }
      }
    }

    function fadeSwitch(show, hide) {
      show.classList.add("visible"); show.classList.remove("hidden");
      hide.classList.add("hidden"); hide.classList.remove("visible");
    }

    function nextSlide() {
      currentIndex = (currentIndex + 1) % slides.length;
      showSlide();
    }

    /******** AUTO REFRESH ********/
    // Refresh tiap 4 jam
    setInterval(() => location.reload(), HARD_REFRESH_EVERY_MS);

    // Reload jam 03.00
    function scheduleDailyReload() {
      const now = new Date();
      const next = new Date(now);
      next.setHours(DAILY_RELOAD_HOUR, 0, 0, 0);
      if (next <= now) next.setDate(next.getDate() + 1);
      setTimeout(() => location.reload(), next - now);
    }
    scheduleDailyReload();

    // Reload saat online kembali
    window.addEventListener('online', () => location.reload());

    // Soft reload jika idle 5 menit
    let lastHeartbeat = Date.now();
    setInterval(() => {
      const now = Date.now();
      if (now - lastHeartbeat > 5 * 60 * 1000) {
        console.warn("⚠️ Freeze terdeteksi, reload…");
        location.reload();
      }
    }, 60000);
    function heartbeat() {
      lastHeartbeat = Date.now();
      requestAnimationFrame(heartbeat);
    }

    /******** BOOT ********/
    (async function boot() {
      startTicker();
      heartbeat();
      await ensureAwake();
      await loadSlides();
    })();
  </script>
</body>
</html>
